<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="../Scripts/Login.js" type="module" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="..\Styles\Style.css">
    <link rel="stylesheet" href="..\Styles\Login.css">
</head>

<body>
    <main class="px-4 py-5 my-5 text-center">
        <h1 class="h1 mb-5 fw-bold">Sistema de gerenciamento de demandas</h1>
        
        <form>
            <h2 class="h2 mb-1 fw-bold">Login</h2>

            <div class="campos">
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" placeholder="exemplo@exemplo.com">
                <div id="erroEmail" class="invalid-feedback"></div>
            </div>
    
            <div class="campos">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="***********">
                <div id="erroSenha" class="invalid-feedback"></div>
            </div>

                <button type="submit" class="btn">Login</button>
                
                <a href="Cadastro.html">Cadastre-se</a>
                
                <!-- !!PLACEHOLDER TEMPORÁRIO PRA NAVEGAÇÃO LIVRE, REMOVER QUANDO LOGIN FOR FUNCIONAL!! -->
                <a href="Dashboard_Projeto.html">Placeholder</a>
        </form>

    </main>
</body>
</html>
