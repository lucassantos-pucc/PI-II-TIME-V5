<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="..\Styles\Style.css">
    <link rel="stylesheet" href="..\Styles\Details.css">
    
</head>
<body>
<dialog class="Popup" id="DialogBox">
    <header>
        <h1><b>&lt; Titulo da demanda &gt;</b></h1>
    </header>

    <section class="Details">
        <div class="Container">
            <span>Melhoria</span>
        </div>

        <div class="Container">
            <span>Em andamento</span>
        </div>

        <div class="Container">
            <span id="Responsavel">Responsavel: Arthur</span>
        </div>

        <div class="Container">
            <span>Prazo: 01/01/2027</span>
        </div>

        <div class="Container">
            <span>Prioridade: Alta</span>
        </div>
    </section>

    <section class="Description">
        <p>Descrição</p>
    </section>
    <button type="button" onclick="HideDialog()">Fechar Popup</button>

</dialog>

<button type="button" onclick="ShowDialog()">Display Popup</button>

<script>
    const dialog = document.getElementById("DialogBox");

    function ShowDialog() {
        dialog.showModal();
    }

    function HideDialog() {
    dialog.classList.add("closing");

    setTimeout(() => {
        dialog.close();
        dialog.classList.remove("closing");
    }, 400);
}


    dialog.addEventListener("click", function(event) {
        if (event.target === dialog) {
            HideDialog();
        }
    });
</script>

</html>
