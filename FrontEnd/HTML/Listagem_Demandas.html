<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Styles/Style.css">
    <link rel="stylesheet" href="../Styles/Listagem_Style.css">
    <link rel="stylesheet" href="../Styles/Details.css">
    <link rel="stylesheet" href="../Styles/Menu.css">
    
    <script src="../Scripts/Menu.js" defer></script>
    <script src="../Scripts/Listagem_Demandas.js" defer></script>
    <script src="../Scripts/Detalhes_Demanda.js" defer></script>
</head>

<body>
    <header>
        <h1 class="logo"><b>Listagem de Demandas</b></h1>
    </header>
    <!-- isso vai se usado para esconder o menu de pesquisa(gambiarra porque nao vimos javascript)--> 
    <input type="checkbox" id="escondido" class="invisivel">

    <label for="escondido" class="btn-personalizado">Buscar / Filtrar</label>

    <div id="painel-pesquisa" class="painel-pesquisa">
        
        <div class="grupo-filtro">
            <label>Nome da Demanda</label>
            <input type="text" placeholder="Pesquisar por nome...">
        </div>

        <div class="grupo-filtro">
            <label>Tipo de Demanda</label>
            <select>
                <option value="">Todos os tipos</option>
                <option value="tarefa">Tarefa</option>
                <option value="defeito">Defeito</option>
                <option value="melhoria">Melhoria</option>
                <option value="documentacao">Documentação</option>
            </select>
        </div>

        <div class="grupo-filtro">
            <label>Prioridade</label>
            <select>
                <option value="">Todas</option>
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
                <option value="critica">Crítica</option>
            </select>
        </div>

        <div class="grupo-filtro">
            <label>Status</label>
            <select>
                <option value="">Todos</option>
                <option value="aberta">Aberta</option>
                <option value="em-andamento">Em andamento</option>
                <option value="em-revisao">Em revisão</option>
                <option value="concluida">Concluída</option>
                <option value="cancelada">Cancelada</option>
            </select>
        </div>

        <div class="grupo-filtro">
            <label>Projeto Vinculado</label>
            <input type="text" placeholder="Nome do projeto...">
        </div>

        <div class="grupo-filtro">
            <label>Responsável</label>
            <input type="text" placeholder="Nome do responsável...">
        </div>

        <div class="grupo-filtro">
            <label>Data de Criação</label>
            <input type="date">
        </div>

        <div class="grupo-filtro">
            <label>Prazo de Entrega</label>
            <input type="date">
        </div>

        <div class="grupo-botao-filtro">
            <button class="btn-personalizado">Aplicar Filtros</button>
        </div>
    </div>
    <section class="demanda" id="secao-demanda">
    </section>
    <footer class="bolha">
    <a class="btn" href="Gerenciamento_Projetos.html">+</a>
    </footer>
</body>
</html>
