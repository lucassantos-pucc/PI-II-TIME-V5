<!--
    Este arquivo é só um pedaço de HTML. O Menu.js carrega ele (com fetch) e coloca no <body> de cada página.
    O botão ☰ é movido para o <header> pelo JS. O onclick chama as funções ShowMenu() e HideMenu() do Menu.js.
-->
<button class="btn" id="MenuButton" type="button" onclick="ShowMenu()">☰</button>

<dialog class="Menu" id="MenuBox">
    <section class="MenuContent">
        <h1 id="MenuTitle">Menu</h1>
        <h2 id="NomeUsuario">Usuário</h2>

        <div id="MenuLinksBox"></div>

        <button class="btn" type="button" onclick="HideMenu()">Fechar Menu</button>
    </section>
</dialog>
